apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-home-lab
  namespace: argocd
spec:
  secretName: argocd-server-tls
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  isCA: false
  usages:
    - server auth
    - client auth
  subject:
    organizations:
      - cert-manager
      - homelab
  commonName: argocd.home.lab
  dnsNames:
    - argocd.home.lab
  uris:
    - spiffe://cluster.local/ns/sandbox/sa/example
  emailAddresses:
    - john.doe@cert-manager.io
  ipAddresses:
    - 10.0.0.46
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
